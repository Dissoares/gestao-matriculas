<p-card styleClass="pagina-card">
  <ng-template #header>
    <div class="pagina-card-header">
      <div>
        <h1>Aulas disponíveis</h1>
        <p class="subtitulo">
          Exibindo apenas aulas autorizadas para o seu curso.
        </p>
      </div>
      <p-button label="Atualizar" icon="pi pi-refresh" severity="secondary" [outlined]="true"
        (onClick)="buscarAulas()" />
    </div>
  </ng-template>

  @if (carregando()) {
  <div class="estado-carregando">
    <p-progressspinner strokeWidth="4" styleClass="spinner-pequeno" />
    <span>Carregando aulas...</span>
  </div>
  } @else {
  <p-table [value]="aulas()" dataKey="id" [paginator]="true" [rows]="8" [rowsPerPageOptions]="[8, 16, 32]"
    [showCurrentPageReport]="true" currentPageReportTemplate="{first} a {last} de {totalRecords} aulas"
    styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines">
    <ng-template #header>
      <tr>
        <th>Disciplina</th>
        <th>Professor</th>
        <th>Horário</th>
        <th style="width: 120px; text-align: center">Vagas</th>
        <th style="width: 140px"></th>
      </tr>
    </ng-template>
    <ng-template #body let-aula>
      <tr>
        <td>
          <strong>{{ aula.disciplina.nome }}</strong>
        </td>
        <td>{{ aula.professor.nome }}</td>
        <td>
          <i class="pi pi-clock" style="margin-right: 0.4rem; color: var(--p-text-muted-color)"></i>
          {{ aula.horario | horario }}
        </td>
        <td style="text-align: center">
          <p-tag [value]="aula.vagasDisponiveis + ' vagas'" [severity]="severidadeVagas(aula.vagasDisponiveis)" />
        </td>
        <td>
          <p-button label="Matricular" icon="pi pi-check" size="small" [loading]="matriculando() === aula.id"
            (onClick)="matricular(aula)" />
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">
          <div class="estado-vazio">
            <i class="pi pi-inbox"></i>
            <span>Não há aulas disponíveis para o seu curso no momento.</span>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
  }
</p-card>
