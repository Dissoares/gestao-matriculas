<header class="header">
  <div class="header-marca">
    <i class="pi pi-graduation-cap header-icone"></i>
    <div class="header-texto">
      <span class="header-titulo">Gestão de Matrículas</span>
      <span class="header-subtitulo">Sistema Acadêmico</span>
    </div>
  </div>
  <div class="header-usuario">
    <p-avatar [label]="nomeUsuario.charAt(0).toUpperCase()" shape="circle" styleClass="header-avatar" />
    <div class="header-usuario-info">
      <span class="header-usuario-nome">{{ nomeUsuario }}</span>
    </div>
    <p-button label="Sair" icon="pi pi-sign-out" severity="contrast" [text]="true" size="small" (onClick)="sair()" />
  </div>
</header>
