services:
  postgres:
    image: postgres:16-alpine
    container_name: get_matriculas-db
    environment:
      POSTGRES_DB: get_matriculas
      POSTGRES_USER: administrathor
      POSTGRES_PASSWORD: alun0x789xyz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U administrathor -d get_matriculas"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: get-matriculas-keycloak
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: administrathor
      KC_DB_PASSWORD: alun0x789xyz
      KC_BOOTSTRAP_ADMIN_USERNAME: keycloakadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: acess0x789xyz
      KC_HTTP_PORT: 8180
    volumes:
      - ./infra/keycloak-realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: get-matriculas-back
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/get_matriculas
      QUARKUS_DATASOURCE_USERNAME: administrathor
      QUARKUS_DATASOURCE_PASSWORD: alun0x789xyz
      QUARKUS_OIDC_AUTH_SERVER_URL: http://keycloak:8180/realms/get-matriculas
      QUARKUS_OIDC_CLIENT_ID: get-matriculas-back
    ports:
      - "8080:8080"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: get-matriculas-front
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
